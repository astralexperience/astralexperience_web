    :root{--bg:#070E13;--accent:#7CADBE;--main:#03586F;--light:#A3CDDD;--text:#fff;--muted:#6f8f9b;--font:"Barlow Condensed","Arial Narrow",sans-serif}
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:var(--bg);color:var(--text)}
    body{font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.85) 100%)}
    .grain{position:fixed;inset:-50%;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain 1s steps(6) infinite}
    @keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(-4%,3%)}100%{transform:translate(3%,-2%)}}
    main{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,4vw,48px);pointer-events:none}
    main a,main button{pointer-events:auto}
    .top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--muted)}
    .sig{display:flex;align-items:center;gap:10px}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 1.6s steps(2) infinite}
    @keyframes blink{50%{opacity:.15}}
    .center{align-self:center;justify-self:center;text-align:center;display:grid;gap:clamp(18px,3vw,34px);justify-items:center}
    .code{font-weight:800;font-size:clamp(40px,10vw,160px);line-height:.82;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
    .code .row{display:block}
    .code .row span{display:inline-block;width:.56em;text-align:center;transition:color .4s}
    .code .x{color:transparent;-webkit-text-stroke:1px rgba(163,205,221,.45)}
    .code .k{color:var(--text);text-shadow:0 0 30px rgba(124,173,190,.35)}
    .claim{font-weight:600;font-size:clamp(13px,1.4vw,16px);letter-spacing:.42em;color:var(--light)}
    .count{display:flex;gap:clamp(14px,3vw,34px);font-variant-numeric:tabular-nums}
    .count div{display:grid;justify-items:center;gap:6px}
    .count b{font-weight:800;font-size:clamp(28px,4.5vw,56px);line-height:1}
    .count small{font-size:10px;letter-spacing:.24em;color:var(--muted)}
    .progress{width:min(360px,70vw);height:1px;background:rgba(163,205,221,.18);position:relative}
    .progress i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--main),var(--accent))}
    .note{font-size:11px;letter-spacing:.2em;color:var(--muted)}
    .cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:1px solid rgba(163,205,221,.35);font-weight:700;font-size:11px;letter-spacing:.18em;transition:.25s}
    .btn:hover,.btn:focus-visible{border-color:var(--accent);color:var(--accent)}
    .ico{width:14px;height:14px;fill:currentColor;flex:none;opacity:.9}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
    .btn.primary:hover{background:var(--main);border-color:var(--main);color:#fff}
    .bottom a:hover{color:var(--text)}
    :focus-visible{outline:1px solid var(--accent);outline-offset:4px}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    @media(max-width:600px){.top .hide-m{display:none}.bottom{flex-direction:column;gap:8px}.code{font-size:14.5vw}}
    @media(prefers-reduced-motion:reduce){.grain,.dot{animation:none}}

  <script>
  (() => {
    /* ═══════════════ CONFIG (editable) ═══════════════
       START: cuándo empieza a descifrarse el nombre (0 %).
       END:   el día del cambio (100 %): a esa hora el nombre queda completo
              y el aviso pasa a "YA ESTÁ AQUÍ".                              */
    const START = new Date('2026-10-20T00:00:00+02:00');
    const END   = new Date('2026-11-02T00:00:00+01:00');
    /* ═════════════════════════════════════════════════ */

    const $ = (s) => document.querySelector(s);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const GLYPHS = '#%&/<>[]{}=+*?!$@0123456789';

    /* ---- Nombre cifrado: cada día se revelan más letras, siempre en el mismo orden ---- */
    const cells = [];
    document.querySelectorAll('[data-word]').forEach((row) => {
      [...row.dataset.word].forEach((ch) => {
        const s = document.createElement('span');
        s.textContent = ch; s.className = 'x'; s.setAttribute('aria-hidden', 'true');
        row.append(s); cells.push({ el: s, ch });
      });
    });
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    // Letras fijas desde el primer día (posición dentro de "ASTRALEXPERIENCE"): A·L / E·X·N
    const PINNED = [0, 5, 6, 7, 13];
    const rest = cells.map((_, i) => i).filter((i) => !PINNED.includes(i)).sort(() => rnd() - .5);
    const order = [...PINNED, ...rest];

    const pad = (n) => String(n).padStart(2, '0');
    let progress = 0;
    function tick() {
      const now = Date.now();
      progress = Math.min(1, Math.max(0, (now - START) / (END - START)));
      const shown = PINNED.length + Math.round(progress * rest.length);
      const open = new Set(order.slice(0, shown));
      cells.forEach((c, i) => {
        if (open.has(i)) { c.el.textContent = c.ch; c.el.className = 'k'; }
        else { c.el.className = 'x'; c.el.textContent = reduced ? '#' : GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; }
      });
      $('[data-pct]').textContent = String(Math.floor(progress * 100)).padStart(3, '0') + '%';
      $('[data-bar]').style.width = (progress * 100) + '%';
      let left = Math.max(0, END - now);
      const d = Math.floor(left / 864e5); left -= d * 864e5;
      const h = Math.floor(left / 36e5); left -= h * 36e5;
      const m = Math.floor(left / 6e4); left -= m * 6e4;
      $('[data-d]').textContent = pad(d); $('[data-h]').textContent = pad(h);
      $('[data-m]').textContent = pad(m); $('[data-s]').textContent = pad(Math.floor(left / 1e3));
      if (progress >= 1) {
        $('[data-count]').hidden = true;
        $('[data-claim]').textContent = 'YA ESTÁ AQUÍ';
        $('[data-note]').textContent = 'DESCÚBRELO EN INSTAGRAM';
        $('[data-status]').textContent = 'SEÑAL ABIERTA';
      }
    }
    tick(); setInterval(tick, reduced ? 1000 : 120);
    $('[data-year]').textContent = new Date().getFullYear();

    /* ---- Señal: líneas de interferencia que reaccionan al cursor o al dedo ---- */
    const cv = $('#signal'), ctx = cv.getContext('2d');
    let W = 0, H = 0, dpr = 1, px = -1e4, py = -1e4, t = 0, running = true;
    const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize(); addEventListener('resize', resize);
    const move = (x, y) => { px = x; py = y; };
    addEventListener('pointermove', (e) => move(e.clientX, e.clientY), { passive: true });
    addEventListener('pointerleave', () => move(-1e4, -1e4));
    addEventListener('touchmove', (e) => { const p = e.touches[0]; if (p) move(p.clientX, p.clientY); }, { passive: true });
    document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running && !reduced) requestAnimationFrame(draw); });

    function noise(x, y) { return Math.sin(x * 1.7 + y * 3.1) * .5 + Math.sin(x * .6 - y * 1.3 + t * .7) * .35 + Math.sin(x * 3.3 + t * 1.9) * .15; }
    function draw() {
      if (!running) return;
      t += .016;
      ctx.clearRect(0, 0, W, H);
      const lines = Math.round(H / 14), step = Math.max(6, W / 160);
      const calm = .25 + .75 * (1 - progress); // cuanto más cerca del día, más limpia la señal
      for (let i = 0; i < lines; i++) {
        const y0 = (i + .5) * (H / lines);
        ctx.beginPath();
        for (let x = 0; x <= W + step; x += step) {
          const dx = x - px, dy = y0 - py, dist = Math.sqrt(dx * dx + dy * dy);
          const near = Math.max(0, 1 - dist / 260);
          const center = Math.exp(-Math.pow((x - W / 2) / (W * .28), 2));
          const amp = (6 + 22 * center) * calm + near * 38;
          const y = y0 + noise(x * .012, i * .35) * amp * (.6 + .4 * Math.sin(t + i));
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        const glitch = Math.random() < .015 * calm;
        ctx.strokeStyle = glitch ? 'rgba(124,173,190,.85)' : `rgba(163,205,221,${.07 + .1 * Math.abs(Math.sin(i * .7 + t * .5))})`;
        ctx.lineWidth = glitch ? 1.5 : 1;
        ctx.stroke();
      }
      if (!reduced) requestAnimationFrame(draw);
    }
    draw();
  })();
  </script>
